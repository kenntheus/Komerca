name: API

on:
  push:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api.yml'

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: komerca
          POSTGRES_PASSWORD: komerca
          POSTGRES_DB: komerca_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        working-directory: apps/api
        run: npm ci

      - name: Generate Prisma client
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://komerca:komerca@localhost:5432/komerca_test
        run: npx prisma generate

      - name: Push schema to test DB
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://komerca:komerca@localhost:5432/komerca_test
        run: npx prisma db push --accept-data-loss

      - name: Lint
        working-directory: apps/api
        run: npm run lint

      - name: Typecheck
        working-directory: apps/api
        run: npm run typecheck

      - name: Test
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://komerca:komerca@localhost:5432/komerca_test
          JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters
          JWT_REFRESH_SECRET: ci-refresh-secret-at-least-32-characters
          NODE_ENV: test
        run: npm test
