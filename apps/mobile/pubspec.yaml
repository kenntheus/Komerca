name: komerca
description: "Komerca — Your Everyday Marketplace. A second-hand marketplace for the Philippines."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.1.4

  # HTTP
  dio: ^5.4.3

  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Images
  image_picker: ^1.1.2
  flutter_image_compress: ^2.2.1
  cached_network_image: ^3.4.1

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Fonts
  google_fonts: ^6.2.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
